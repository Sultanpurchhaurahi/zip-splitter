name: Build Android APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-venv \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Create Python virtual environment
        run: |
          python3 -m venv .venv

      - name: Install Python build tools
        run: |
          . .venv/bin/activate

          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            buildozer \
            cython

      - name: Build APK
        run: |
          . .venv/bin/activate

          yes | buildozer android debug

      - name: Find APK
        run: |
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-zip-splitter-apk
          path: bin/*.apk
          if-no-files-found: error
